<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>GymFit Admin</title>
<style>
body{font-family:system-ui,sans-serif;background:#0B0B0F;color:#fff;max-width:900px;margin:0 auto;padding:30px 20px}
input,textarea,button{font:inherit;padding:10px;border-radius:6px;border:1px solid #2A2A33;background:#15151B;color:#fff}
button{background:#FF3B1F;border:0;cursor:pointer;font-weight:700}
textarea{width:100%;height:340px;font-family:monospace;font-size:.85rem}
.msg{background:#15151B;border-left:4px solid #2F5BFF;padding:12px 16px;margin:10px 0;border-radius:6px}
small{color:#B8B8C4}
</style></head><body>
<h1>GymFit Admin</h1>
<p><input id="key" type="password" placeholder="Admin key"> <button id="go">Load</button> <span id="err" style="color:#ff7b66"></span></p>
<h2>Overview</h2><p id="stats"><small>Enter the key to load.</small></p>
<h2>Free-trial requests</h2><div id="msgs"></div>
<h2>Edit site content (goals, diet plans, exercises)</h2>
<p><small>Changes appear on the website right after you save and refresh it.</small></p>
<textarea id="content" spellcheck="false"></textarea><p><button id="save">Save content</button> <span id="saved"></span></p>
<script>
const $=id=>document.getElementById(id);
const h=()=>({"Content-Type":"application/json","x-admin-key":$("key").value});
$("go").onclick=async()=>{
  $("err").textContent="";
  const r=await fetch("/api/admin/overview",{headers:h()}), d=await r.json();
  if(!r.ok){$("err").textContent=d.error;return}
  $("stats").textContent=d.users+" registered users, "+d.messages.length+" requests";
  $("msgs").innerHTML="";
  d.messages.forEach(m=>{const e=document.createElement("div");e.className="msg";
    e.textContent=m.name+" <"+m.email+"> · "+m.goal+" · "+new Date(m.at).toLocaleString()+(m.message?"\n"+m.message:"");e.style.whiteSpace="pre-wrap";$("msgs").appendChild(e)});
  $("content").value=JSON.stringify(await (await fetch("/api/content")).json(),null,2);
};
$("save").onclick=async()=>{
  try{const b=JSON.parse($("content").value);
    const r=await fetch("/api/admin/content",{method:"PUT",headers:h(),body:JSON.stringify(b)});
    $("saved").textContent=r.ok?"Saved!":(await r.json()).error;
  }catch(e){$("saved").textContent="Invalid JSON: "+e.message}
};
</script></body></html>
